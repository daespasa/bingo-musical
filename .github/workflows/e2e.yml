name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bingo
          POSTGRES_PASSWORD: bingo
          POSTGRES_DB: bingo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bingo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://bingo:bingo@localhost:5432/bingo
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-only-session-secret-not-for-production
      GUEST_TOKEN_SECRET: ci-only-guest-secret-not-for-production
      WEB_URL: http://localhost:3000
      API_URL: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Write .env for the servers
        run: |
          cp .env.example .env
          sed -i "s|^SESSION_SECRET=.*|SESSION_SECRET=$SESSION_SECRET|" .env
          sed -i "s|^GUEST_TOKEN_SECRET=.*|GUEST_TOKEN_SECRET=$GUEST_TOKEN_SECRET|" .env
      - name: Prepare database and demo assets
        run: |
          pnpm db:deploy
          pnpm db:seed
          pnpm demo:assets
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: pnpm test:e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
