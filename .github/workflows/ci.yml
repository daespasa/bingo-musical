name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bingo
          POSTGRES_PASSWORD: bingo
          POSTGRES_DB: bingo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bingo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bingo:bingo@localhost:5432/bingo
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-only-session-secret-not-for-production
      GUEST_TOKEN_SECRET: ci-only-guest-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Write .env from the example
        run: |
          cp .env.example .env
          sed -i "s|^SESSION_SECRET=.*|SESSION_SECRET=$SESSION_SECRET|" .env
          sed -i "s|^GUEST_TOKEN_SECRET=.*|GUEST_TOKEN_SECRET=$GUEST_TOKEN_SECRET|" .env
      - name: Validate Prisma schema and migrations
        run: pnpm --filter @bingo/database prisma:validate && pnpm db:deploy
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and integration tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Validate docker compose
        run: docker compose config -q

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Commitlint on PR commits
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
