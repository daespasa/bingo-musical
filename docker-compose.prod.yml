# Superposición para publicar detrás de un proxy inverso (Cloudflare Tunnel).
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --profile full up -d --build
#
# Postgres y Redis dejan de publicar puertos: solo se alcanzan desde la red
# interna del stack. La web y la API se publican solo en la interfaz de loopback
# (`BIND_ADDR`), porque quien las expone a internet es el túnel, no el host: así
# no quedan accesibles desde el resto de la red local. Si tu cloudflared no
# comparte la red del host, apúntalo a la IP del bridge y pon `BIND_ADDR=0.0.0.0`.
services:
  bingo-postgres:
    ports: !reset []

  bingo-redis:
    ports: !reset []

  bingo-api:
    environment:
      API_URL: ${API_URL:?API_URL required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    # `!override`: sin él, Compose *acumula* las listas de puertos y la web y la
    # API seguirían abriendo también los 3000/3001 del fichero base.
    ports: !override
      - '${BIND_ADDR:-127.0.0.1}:${API_HOST_PORT:-3101}:3001'

  bingo-web:
    ports: !override
      - '${BIND_ADDR:-127.0.0.1}:${WEB_HOST_PORT:-3100}:3000'
